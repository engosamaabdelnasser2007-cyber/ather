  --on-forest:#0a140f;
}
body{background:
  radial-gradient(1100px 560px at 85% -12%,var(--gold-soft),transparent 62%),
  radial-gradient(900px 520px at -5% 112%,rgba(157,176,138,.3),transparent 60%),
  var(--cream)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.7;background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 112 112%22%3E%3Cg fill=%22none%22 stroke=%22%23ad8736%22 stroke-opacity=%22.13%22 stroke-width=%221%22%3E%3Crect x=%2236%22 y=%2236%22 width=%2240%22 height=%2240%22/%3E%3Crect x=%2236%22 y=%2236%22 width=%2240%22 height=%2240%22 transform=%22rotate(45 56 56)%22/%3E%3Ccircle cx=%2256%22 cy=%2256%22 r=%229%22/%3E%3Cpath d=%22M0 56h36M76 56h36M56 0v36M56 76v36%22/%3E%3Ccircle cx=%220%22 cy=%220%22 r=%226%22/%3E%3Ccircle cx=%22112%22 cy=%220%22 r=%226%22/%3E%3Ccircle cx=%220%22 cy=%22112%22 r=%226%22/%3E%3Ccircle cx=%22112%22 cy=%22112%22 r=%226%22/%3E%3C/g%3E%3C/svg%3E");background-size:112px 112px}
#root{position:relative;z-index:1}
h1,h2,h3{letter-spacing:.005em}
::selection{background:var(--gold-2);color:#1a1405}

/* بطاقات */
.surface{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,0) 42%),var(--paper);border:1px solid var(--line);border-radius:var(--r-lg)}
[data-theme=dark] .surface{background:linear-gradient(180deg,rgba(255,255,255,.045),transparent 44%),var(--paper)}
.surface::before{content:"";position:absolute;inset:0 28px auto;height:1px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--gold-2),transparent);opacity:.9}
.surface.organic{border-radius:40px 20px}
.welcome{background:linear-gradient(135deg,var(--paper),var(--gold-soft))}

/* أزرار */
.btn{border:1px solid var(--gold);color:var(--forest);letter-spacing:.01em;transition:transform .25s var(--ease),box-shadow .25s,background .25s}
.btn:hover{box-shadow:0 10px 22px -14px var(--gold)}
.btn-primary{background:linear-gradient(180deg,#22603f,#123a27);color:#fbf3dc;border-color:rgba(224,194,116,.65);box-shadow:0 14px 26px -16px rgba(20,64,43,.95),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-primary:hover{box-shadow:0 16px 30px -14px rgba(20,64,43,.95),0 0 0 3px rgba(224,194,116,.25),inset 0 1px 0 rgba(255,255,255,.22)}
[data-theme=dark] .btn-primary{background:linear-gradient(180deg,#e8cd88,#b8933f);color:#1a1405;border-color:#f1d996}
.btn-ghost{border-color:var(--line)}
.chip,.opt,.seg button{transition:all .22s var(--ease)}
.chip[aria-pressed=true],.seg button[aria-pressed=true]{background:linear-gradient(180deg,var(--forest-2),var(--forest));color:var(--on-forest);border-color:var(--gold)}
[data-theme=dark] .chip[aria-pressed=true],[data-theme=dark] .seg button[aria-pressed=true]{background:linear-gradient(180deg,#e8cd88,#b8933f);color:#1a1405}
.seg{background:var(--paper-2);box-shadow:inset 0 1px 3px rgba(20,64,43,.12);border:1px solid var(--line)}
.input{background:var(--paper);border:1px solid var(--line);box-shadow:inset 0 1px 3px rgba(20,64,43,.08)}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--glow)}

/* التنقل: كبسولة زجاجية عائمة */
.bottom-nav{inset:auto 10px calc(10px + env(safe-area-inset-bottom));padding:6px;gap:2px;border-radius:28px;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(20px) saturate(1.35);-webkit-backdrop-filter:blur(20px) saturate(1.35);box-shadow:0 22px 44px -20px rgba(20,64,43,.6),0 1px 0 rgba(255,255,255,.7) inset}
.nav-item{flex:1 1 0;min-width:0;padding:7px 2px 9px;font-size:11px;border-radius:20px;transition:all .25s var(--ease)}
.nav-item svg{width:23px;height:23px}
.nav-item[aria-current=page]{background:linear-gradient(180deg,rgba(224,194,116,.32),rgba(224,194,116,.08));box-shadow:inset 0 0 0 1px var(--line);color:var(--forest)}
.nav-item[aria-current=page]::after{content:"";position:absolute;bottom:3px;width:16px;height:2px;border-radius:2px;background:var(--gold)}
.app-main{padding-bottom:128px}
@media(min-width:900px){
  .bottom-nav{position:sticky;inset:auto;top:12px;margin:12px;height:calc(100vh - 24px);width:96px;padding:22px 8px;gap:8px;border-radius:30px;border:1px solid var(--line)}
  .nav-item{flex:0 0 auto;padding:10px 4px}
  .app-main{padding-bottom:var(--s-7)}
}

/* العلامة: أثر */
.l-brand,.brand h1{font-family:var(--f-display);font-weight:700;background:linear-gradient(135deg,var(--forest) 10%,var(--forest-2) 45%,#a9822f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
[data-theme=dark] .l-brand,[data-theme=dark] .brand h1{background:linear-gradient(135deg,#f1d996,#dcbd7a 55%,#b8933f);-webkit-background-clip:text;background-clip:text}
.l-brand{display:flex;align-items:center;gap:12px;font-size:40px;line-height:1.1}
.l-brand::before,.brand h1::before{content:"";flex:none;display:block;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23f3dc9a%22/%3E%3Cstop offset=%22.5%22 stop-color=%22%23c9a24b%22/%3E%3Cstop offset=%221%22 stop-color=%22%2394701f%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2229%22 fill=%22none%22 stroke=%22url(%23g)%22 stroke-width=%222.2%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2224.5%22 fill=%22none%22 stroke=%22url(%23g)%22 stroke-width=%22.9%22 opacity=%22.6%22/%3E%3Cpath d=%22M32 49V31%22 stroke=%22url(%23g)%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M32 34c-9.5 0-14.5-5-14.5-13.5C27 20.5 32 25.5 32 34z%22 fill=%22url(%23g)%22/%3E%3Cpath d=%22M32 29c0-8.5 5-13.5 14.5-13.5C46.500 24 41.500 29 32 29z%22 fill=%22url(%23g)%22 opacity=%22.85%22/%3E%3Cpath d=%22M21 50.500c6.500-3.200 15.500-3.200 22 0%22 stroke=%22url(%23g)%22 stroke-width=%222.2%22 fill=%22none%22 stroke-linecap=%22round%22 opacity=%22.75%22/%3E%3C/svg%3E") center/contain no-repeat;-webkit-text-fill-color:initial;filter:drop-shadow(0 6px 10px rgba(173,135,54,.4))}
.l-brand::before{width:46px;height:46px}
.brand h1{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:52px;line-height:1.1}
.brand h1::before{width:72px;height:72px}
.brand .muted{font-family:var(--f-display);font-size:19px;color:var(--olive);margin-top:4px}
.l-hero h1{font-size:clamp(32px,7.4vw,54px)}
.l-hero .sub{font-family:var(--f-display);font-size:20px;color:var(--olive)}
.step b{color:var(--forest)}
.step .num{border-color:var(--gold);box-shadow:0 0 0 4px rgba(224,194,116,.18)}

/* تفاصيل */
.sheet-back{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.sheet{border-radius:34px 34px 0 0;border:1px solid var(--line);border-bottom:0;box-shadow:0 -26px 60px -24px rgba(0,0,0,.55);background:linear-gradient(180deg,rgba(255,255,255,.5),transparent 30%),var(--paper)}
[data-theme=dark] .sheet{background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 30%),var(--paper)}
.sheet::before{content:"";display:block;width:46px;height:4px;border-radius:4px;background:var(--line);margin:-10px auto 14px}
.pdot{border-color:var(--sage);box-shadow:0 8px 16px -10px var(--forest)}
.pnode[data-state=completed_on_time] .pdot{background:linear-gradient(160deg,var(--forest-2),var(--forest));border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,194,116,.28),0 10px 18px -10px var(--forest)}
.pnode[data-state=completed_late] .pdot{background:linear-gradient(160deg,var(--gold-2),var(--gold))}
.cal-d[data-s=full]{background:linear-gradient(160deg,var(--forest-2),var(--forest));box-shadow:inset 0 0 0 1px rgba(224,194,116,.45)}
.facts div{border:1px solid var(--line);background:linear-gradient(180deg,var(--paper),var(--paper-2))}
.pbar{box-shadow:inset 0 1px 2px rgba(20,64,43,.15)}
.pbar>i{background:linear-gradient(90deg,var(--olive),var(--gold-2))}
.stage-chip{border-color:var(--gold);box-shadow:0 8px 18px -12px var(--gold)}
.toast{border:1px solid var(--gold);border-radius:20px;box-shadow:0 18px 36px -16px rgba(0,0,0,.6)}
.preview-note{border-color:var(--gold)}
.avatar{border-color:var(--gold)}
.level-name{background:linear-gradient(135deg,var(--forest),#a9822f);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ============ قريتي ============ */
.vl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.vl-head h1{font-size:36px}
.vl-head .h-ornament{margin:6px 0 0}
.vl-lvchip{display:grid;justify-items:center;padding:8px 18px;border-radius:20px;background:linear-gradient(180deg,var(--paper),var(--paper-2));border:1px solid var(--gold);box-shadow:var(--shadow);line-height:1.35;white-space:nowrap}
.vl-lvchip small{font-size:11px;color:var(--ink-2);font-weight:700}
.vl-lvchip b{font-family:var(--f-display);color:var(--forest);font-size:18px}
.vl-scene{position:relative;overflow:hidden;isolation:isolate;border-radius:32px;border:1px solid var(--gold);box-shadow:var(--shadow),0 0 0 5px rgba(224,194,116,.14);width:100%;aspect-ratio:4/5;max-height:68vh;background:#d9ecdc}
@media(min-width:900px){.vl-scene{aspect-ratio:16/10;max-height:74vh}}
.vl-svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;cursor:grab;transition:filter 1.2s ease}
.vl-svg:active{cursor:grabbing}
.vl-w1 .vl-svg{filter:saturate(.84) brightness(.99)}
.vl-w2 .vl-svg{filter:saturate(.62) brightness(.96)}
.vl-sky{position:absolute;inset:0 0 auto 0;height:36%;pointer-events:none;z-index:2}
.vl-t-morning .vl-sky{background:linear-gradient(180deg,rgba(176,222,238,.85),rgba(176,222,238,0))}
.vl-t-evening .vl-sky{background:linear-gradient(180deg,rgba(245,166,116,.78),rgba(240,190,140,0))}
.vl-t-night .vl-sky{background:linear-gradient(180deg,rgba(6,16,40,.82),rgba(6,16,40,0))}
.vl-orb{position:absolute;inset-inline-start:14%;top:9%;width:44px;height:44px;border-radius:50%}
.vl-t-morning .vl-orb{background:radial-gradient(circle,#fffbe0 28%,#ffe58a 55%,rgba(255,229,138,0) 74%);width:62px;height:62px;top:4%}
.vl-t-evening .vl-orb{background:radial-gradient(circle,#fff0c4 25%,#ffb468 58%,rgba(255,180,104,0) 76%);width:70px;height:70px;top:12%}
.vl-t-night .vl-orb{width:30px;height:30px;background:transparent;box-shadow:inset -10px 0 0 0 #f6f1d9;filter:drop-shadow(0 0 9px rgba(246,241,217,.7))}
.vl-cloud{position:absolute;height:16px;width:84px;border-radius:16px;background:rgba(255,255,255,.72);filter:blur(1.2px);top:14%;animation:vlc 70s linear infinite}
.vl-cloud.c2{top:24%;width:60px;height:12px;animation-duration:95s;animation-delay:-40s;opacity:.7}
.vl-t-evening .vl-cloud{background:rgba(255,214,186,.7)}
.vl-t-night .vl-cloud{display:none}
@keyframes vlc{0%{inset-inline-start:-90px}100%{inset-inline-start:110%}}
.vl-ctrl{position:absolute;inset-inline-end:10px;bottom:10px;z-index:3;display:grid;gap:6px}
.vl-cb{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:20px;font-weight:700;line-height:1;color:var(--forest);display:grid;place-items:center;box-shadow:0 10px 18px -12px rgba(0,0,0,.6);padding:0}
.vl-cb:active{transform:scale(.94)}
.vl-hint{position:absolute;inset-inline:10px;top:10px;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-radius:16px;border:1px solid var(--gold);background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);font-size:13px;font-weight:700;color:var(--forest)}
.vl-hint button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:2px 12px;font-weight:700;color:var(--forest);flex:none}
.vl-status{text-align:center;font-family:var(--f-display);font-size:19px;line-height:1.7;color:var(--olive);padding:0 8px}
.vl-status[data-w="2"]{color:var(--burgundy)}
.vl-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vl-tools .seg{flex:1;min-width:220px}
.vl-reset{min-height:42px;padding:0 18px}
.vl-pend{text-align:center}
.vl-banner{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:20px;background:linear-gradient(135deg,var(--gold-soft),var(--paper));border:1px solid var(--gold);font-weight:700;animation:rise .45s var(--ease)}
.vl-banner button{border:0;background:transparent;font-size:22px;line-height:1;color:var(--ink-2);padding:0 4px}
.vl-card h2,.vl-card h3{color:var(--forest)}
.vl-need .row{font-weight:700}
.vl-list{display:grid}
.vl-row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:transparent;border:0;border-top:1px solid var(--line);padding:10px 0}
.vl-list .vl-row:first-child{border-top:0}
.vl-mini{width:60px;height:48px;flex:none;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,var(--paper-2),var(--paper));border:1px solid var(--line);display:grid;place-items:center}
.vl-mini svg{width:60px;height:48px}
.vl-rt{display:grid;line-height:1.5}
.vl-zones{display:grid;margin-top:6px}
.vl-zr{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 4px;background:transparent;border:0;border-top:1px solid var(--line);font-weight:700;text-align:start}
.vl-zr[data-open=false]{opacity:.65}
.vl-prev{display:grid;place-items:center;margin:-4px 0 4px;background:radial-gradient(circle at 50% 72%,var(--glow),transparent 66%)}
.vl-reason{text-align:center;font-family:var(--f-display);font-size:20px;line-height:1.75;color:var(--olive);margin:6px 0 12px}
.vl-meta{display:grid;gap:3px;font-size:14px;color:var(--ink-2);text-align:center}
.vl-zemoji{text-align:center;font-size:56px;line-height:1.3}
.vl-dg{margin-top:12px;display:grid;gap:6px}
/* مشهد القرية (SVG) */
.vtx{font:700 13px Tajawal,system-ui,sans-serif;fill:#1f4d33}
.vtx2{font:500 11px Tajawal,system-ui,sans-serif;fill:#7a6d45}
.vi{cursor:pointer}
.vplq,.vfog{cursor:pointer}
.vsway{transform-box:fill-box;transform-origin:50% 100%;animation:vsw 6s ease-in-out infinite}
@keyframes vsw{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.vl-w1 .vsway{animation-duration:9s}
.vl-w2 .vsway{animation-duration:12s}
.vl-w2 .vfl{animation-name:vdroop}
@keyframes vdroop{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-7deg)}}
.vff{transform-box:fill-box;animation:vff 6s ease-in-out infinite}
@keyframes vff{0%,100%{opacity:.15;transform:translate(0,0)}50%{opacity:1;transform:translate(9px,-11px)}}
.gl{transform-box:fill-box;transform-origin:center;animation:vgl 3.6s ease-in-out infinite}
@keyframes vgl{0%,100%{opacity:.78}50%{opacity:1}}
.vwt{stroke-dasharray:7 6;animation:vwt 1.1s linear infinite}
@keyframes vwt{to{stroke-dashoffset:-26}}
.vsp{transform-box:fill-box;transform-origin:center;animation:vsp 2.8s ease-in-out infinite}
@keyframes vsp{0%,100%{opacity:.2;transform:scale(.55)}50%{opacity:1;transform:scale(1.25)}}
.vslot{transform-box:fill-box;transform-origin:center;animation:vsl 1.8s ease-in-out infinite}
@keyframes vsl{0%,100%{transform:scale(.94)}50%{transform:scale(1.07)}}
.vring{animation:vrg 1.2s linear infinite}
@keyframes vrg{to{stroke-dashoffset:-18}}
@media(prefers-reduced-motion:reduce){.vsway,.vff,.gl,.vwt,.vsp,.vslot,.vring,.vl-cloud{animation:none!important}}

/* ============ قفل الصلاة حسب الوقت ============ */
.pg-banner{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center;padding:10px 16px;margin-bottom:12px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--paper),var(--paper-2));font-size:14px}
.pg-banner b{color:var(--forest);font-family:var(--f-display);font-size:17px}
.pg-warn{color:var(--burgundy);justify-content:center;text-align:center}
.pnode[data-lock=true]{opacity:.68}
.pnode[data-lock=true] .pdot{background:var(--paper-2);border:1.5px dashed var(--gold);box-shadow:none}
.pnode[data-lock=true] .pdot svg{stroke:var(--gold)}
.opt[data-lock=true]{opacity:.72;border-style:dashed}
.pg-lock{display:grid;gap:4px;justify-items:center;text-align:center;padding:18px 14px;margin:10px 0;border-radius:22px;border:1px dashed var(--gold);background:linear-gradient(180deg,var(--paper-2),var(--paper))}
.pg-lock p{margin:0}
.pg-ico{font-size:34px;line-height:1.2}
.pg-open{text-align:center;font-weight:700;color:var(--forest);padding:10px;margin:8px 0;border-radius:16px;background:linear-gradient(180deg,rgba(102,122,58,.18),rgba(102,122,58,.06));border:1px solid var(--line)}
.pg-manual{display:grid;gap:6px;margin:10px 0;padding:14px;border-radius:20px;border:1px dashed var(--gold);background:var(--paper-2)}
.pg-manual p{margin:0}

.nd{--green:#1f3d2f;--cream:#f4efe3;--gold:#c9a24b;direction:rtl;font-family:'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,system-ui,sans-serif;background:#ece6d6;color:var(--green);min-height:100vh;padding:14px 14px 40px}
.nd *{box-sizing:border-box}.nd-wrap{max-width:460px;margin:0 auto}
.nd h1{font-size:19px;font-weight:600;margin:4px 2px 10px}

const LSLOT=[[0,8],[-88,16],[90,-4],[4,-58]];
const SLOTS=ZONES.map((z,zi)=>{

const CHT={fajr7:"goldtree",five7:"house",quran7:"library"};
const STK=[[3,"arch"],[7,"house"],[14,"musalla"],[30,"goldtree"],[60,"fountain"],[100,"farm"]];

function specOf(e,seed){
  const H=hash(seed+"|"+e.id),v=(H%997)/997,pick=a=>a[H%a.length];
  let t,r;
  switch(e.cat){
    case"salah":t=e.k===1?"tree":pick(["tree","tree","palm","olive","cypress"]);r=`نمت لأنك أتممت صلاتك رقم ${AR(e.n)}.`;break;
    case"full":t=pick(["rose","tulip","daisy"]);r=`تفتّحت لأنك أتممت الصلوات الخمس في يوم كامل (اليوم الكامل رقم ${AR(e.n)}).`;break;
    case"streak":t=STK[e.k][1];r=`ظهر لأنك حافظت على ${AR(e.n)} ${e.n<=10?"أيام":"يومًا"} كاملة متتالية.`;break;
    case"quran":{const S=["olive","bench","fountain","tree","pavilion","library"];t=e.k<S.length?S[e.k]:pick(["tree","olive","bench"]);r=`فُتح بسبب التزامك بالقرآن، وقد بلغت يوم الورد رقم ${AR(e.n)}.`;break}
    case"adhkar":t=pick(["rose","lavender","daisy"]);r=`فُتحت بعد تحقيق هدف الأذكار في اليوم رقم ${AR(e.n)} من أيام ذكرك.`;break;
    case"qiyam":t=e.k===3?"tent":e.k===0?"lantern":pick(["lantern","starlamp","moonflower"]);r=`فُتح بسبب قيامك — قيام الليلة رقم ${AR(e.n)}.`;break;
    case"task":t=pick(["stone","shrub","bench","stone"]);r=`وُضع لأنك أنجزت مهمتك الصغيرة رقم ${AR(e.n)}.`;break;
    default:t=CHT[e.k];r=`هدية إكمالك «${CHN[e.k]}».`;
  }
  return{t,ti:TT[e.cat][t],r,v};
}

/* ---------- محرك التقدّم: بيانات الأيام ← نمو القرية (لا يكتب فوق بيانات الأيام) ---------- */
function engine(D,today,seed,vs,gapOverride){
  vs=vs||{};
  const P=D.p||{},Q=D.q||{},QI=D.qi||{},AD=D.ad||{},TK=D.tk||[],CH=D.ch||{};
  const PR=["fajr","dhuhr","asr","maghrib","isha"];
  const done=x=>x&&x.status==="completed";
  const okd=d=>/^\d{4}-\d{2}-\d{2}$/.test(d);
  const tkBy={};TK.forEach(t=>{if(okd(t.date))(tkBy[t.date]=tkBy[t.date]||[]).push(t)});
  const dset=new Set([...Object.keys(P),...Object.keys(Q).filter(d=>done(Q[d])),...Object.keys(QI).filter(d=>done(QI[d])),...Object.keys(AD),...Object.keys(tkBy)].filter(okd));
  const days=[...dset].sort();
  let salN=0,prayTotal=0,fullN=0,streak=0,prevFull=null,qN=0,qiN=0,adN=0,tkN=0,last=null;
  const ev=[],got=new Set(),fullDates=[],quranDates=[],fajrDates=[];
  const push=(id,cat,at,n,x)=>ev.push({id,cat,at,n,...x});
  for(const d of days){
    const day=P[d]||{};let c=0,part=false;
    for(const k of PR){const e=day[k];if(done(e))c++;else if(e&&e.status==="partial")part=true}
    if(c){const b=prayTotal;prayTotal+=c;for(let m=b+1;m<=prayTotal;m++){if(m===5||m%20===0){salN++;push("salah-"+m,"salah",d,m,{k:salN})}}}
    if(c===5){
      fullN++;fullDates.push(d);streak=(prevFull&&diffD(prevFull,d)===1)?streak+1:1;prevFull=d;
      if(fullN===1||fullN%5===0)push("full-"+fullN,"full",d,fullN,{});
      const si=STK.findIndex(s=>s[0]===streak);
      if(si>=0&&!got.has(streak)){got.add(streak);push("streak-"+streak,"streak",d,streak,{k:si})}
    }
    if(done(day.fajr))fajrDates.push(d);
    if(done(Q[d])){qN++;quranDates.push(d);if((qN-1)%4===0)push("quran-"+qN,"quran",d,qN,{k:(qN-1)/4})}
    if(done(QI[d])){qiN++;if((qiN-1)%3===0)push("qiyam-"+qiN,"qiyam",d,qiN,{k:(qiN-1)/3})}
    const as=Object.values(AD[d]||{}).reduce((a,b)=>a+(+b||0),0);
    if(as>=33){adN++;if((adN-1)%5===0)push("adhkar-"+adN,"adhkar",d,adN,{k:(adN-1)/5})}
    (tkBy[d]||[]).forEach(()=>{tkN++;if(tkN===3||tkN%8===0)push("task-"+tkN,"task",d,tkN,{})});
    if(c||part||done(Q[d])||done(QI[d])||as>0||tkBy[d])last=d;
  }
  let chDone=0;
  const run=(dates,from)=>{const s=new Set(dates);let r=0;const lim=Math.min(900,diffD(from,today));for(let i=0;i<=lim;i++){const d=addD(from,i);if(s.has(d)){r++;if(r>=7)return d}else r=0}return null};
  [["fajr7",fajrDates],["five7",fullDates],["quran7",quranDates]].forEach(([id,ds])=>{
    const j=CH[id]&&CH[id].joined_on;if(!j||!okd(j))return;const at=run(ds,j);if(at){chDone++;push("ch-"+id,"challenge",at,7,{k:id})}
  });
  const S=prayTotal+5*fullN+3*qN+4*qiN+2*adN+tkN+12*chDone;
  const first=days[0]||null,age=first?Math.max(1,diffD(first,today)+1):1;
  let zu=1;for(let k=1;k<ZONES.length;k++){if(age>=zNeedDays(k)&&S>=zNeedProg(k))zu=k+1;else break}
  zu=Math.max(zu,vs.zs||1);
  const nextZ=zu<ZONES.length?{i:zu,days:zNeedDays(zu),prog:zNeedProg(zu),tp:Math.min(1,age/zNeedDays(zu)),pp:Math.min(1,S/zNeedProg(zu))}:null;
  let gap=last?diffD(last,today):0;if(gapOverride!=null)gap=gapOverride;
  const wilt=!days.length?0:gap<=1?0:gap<=3?1:2;

  /* ترتيب العناصر: Automatic Mode مع Controlled Randomness */
  const items=vs.items||{},custom=vs.custom||{},fresh={},ledger={...items};
  const eff=id=>custom[id]||ledger[id];
  const occ={};occ["0:0"]="__seed";
  Object.keys(ledger).forEach(id=>{const p=eff(id);if(p)occ[p.z+":"+p.s]=id});
  ev.sort((a,b)=>a.at<b.at?-1:a.at>b.at?1:a.id<b.id?-1:1);
  let pending=0;
  for(const e of ev){
    if(ledger[e.id])continue;
    const sp=specOf(e,seed),L=LSET.has(sp.t),rng=mulberry(hash(seed+e.id+"p"));
    let place=null;
    for(let z=0;z<zu&&!place;z++){
      const free=[];SLOTS[z].forEach((s,i)=>{if((s.k==="L")===L&&!occ[z+":"+i])free.push(i)});
      if(!free.length)continue;
      if(L)place={z,s:free[0]};
      else{let best=free[0],bs=1e9;for(const i of free){const s=SLOTS[z][i],d=Math.hypot(s.x-ZONES[z].cx,(s.y-ZONES[z].cy)*1.3)+rng()*60;if(d<bs){bs=d;best=i}}place={z,s:best}}
    }
    if(!place){pending++;continue}
    const ent={t:sp.t,ti:sp.ti,r:sp.r,at:e.at,c:e.cat,v:sp.v,z:place.z,s:place.s};
    ledger[e.id]=ent;fresh[e.id]=ent;occ[place.z+":"+place.s]=e.id;
  }
  const list=Object.keys(ledger).map(id=>{
    const en=ledger[id],p=eff(id)||en,sl=SLOTS[p.z]&&SLOTS[p.z][p.s];
    return{id,...en,z:p.z,s:p.s,x:sl?sl.x:0,y:sl?sl.y:0,L:LSET.has(en.t)};
  }).filter(it=>it.z<ZONES.length);
  const map={};list.forEach(it=>{map[it.id]=it});
  return{items:list,map,occ,fresh,pending,zu,nextZ,S,age,gap,wilt,lv:levelOf(S),last,
    stats:{prayTotal,fullN,qN,qiN,adN,tkN,chDone,streak:Math.max(0,...[...got])}};
}

/* ---------- بيانات تجريبية للمعاينة فقط (لا تُحفظ) ---------- */
function genData(stage,today){
  const days={m1:14,m2:60,m3:95,m6:185,m12:370}[stage]||60,r=mulberry(days*31+5);
  const P={},Q={},QI={},AD={},TK=[];
  for(let i=0;i<days;i++){
    const d=addD(today,-(days-1-i)),day={};
    ["fajr","dhuhr","asr","maghrib","isha"].forEach(k=>{const x=r();if(x<.82)day[k]={status:"completed",timing:r()<.8?"on_time":"late"};else if(x<.9)day[k]={status:"partial",progress:.5};else day[k]={status:"missed"}});
    P[d]=day;
    if(r()<.62)Q[d]={status:"completed"};
    if(r()<.3)QI[d]={status:"completed"};
    if(r()<.6)AD[d]={subhanallah:33,alhamdulillah:33,allahuakbar:r()<.5?33:12};
    const t=r()<.55?(r()<.4?2:1):0;for(let j=0;j<t;j++)TK.push({date:d,taskId:"t"+i+j,roundId:"r"+i+j});
  }
  return{p:P,q:Q,qi:QI,ad:AD,tk:TK,ch:{}};
}
